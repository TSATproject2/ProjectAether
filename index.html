
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ghost Mouse Follower</title>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    background: #101522;
    font-family: Arial, sans-serif;
    color: white;
  }

  /* Floating Ghost */
  #ghost {
    position: fixed;
    top: 15px;
    right: 15px;
    width: 110px;
    height: 110px;
    z-index: 99999;
    pointer-events: none;
  }

  #ghost img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    filter: drop-shadow(0 0 10px #00cfff);
  }

  /* Glowing center eye */
  #ghost-eye {
    position: absolute;
    width: 13px;
    height: 13px;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: #5cf5ff;
    box-shadow:
      0 0 5px #00dfff,
      0 0 12px #00dfff,
      0 0 20px #008cff;
  }

  /* Demo page content */
  .content {
    text-align: center;
    padding-top: 150px;
  }

  h1 {
    color: #49dfff;
  }
</style>
</head>

<body>

<div class="content">
  <h1>SPACE EXPLORER</h1>
  <p>Move your mouse around and watch the Ghost!</p>
</div>

<!-- Destiny Ghost -->
<div id="ghost">
  <img src="image(1).png" alt="Ghost">
  <div id="ghost-eye"></div>
</div>

<script>
  const ghost = document.getElementById("ghost");
  const eye = document.getElementById("ghost-eye");

  document.addEventListener("mousemove", (event) => {

    const rect = ghost.getBoundingClientRect();

    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height / 2;

    const dx = event.clientX - centerX;
    const dy = event.clientY - centerY;

    const angle = Math.atan2(dy, dx);

    const distance = Math.min(
      Math.hypot(dx, dy) / 15,
      7
    );

    const x = Math.cos(angle) * distance;
    const y = Math.sin(angle) * distance;

    eye.style.left = `calc(50% + ${x}px)`;
    eye.style.top = `calc(50% + ${y}px)`;
  });
</script>

</body>
</html>
